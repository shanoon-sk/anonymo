name = "anonymo"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[[r2_buckets]]
binding = "RELEASES"
bucket_name = "anonymo"

# The current release is not a var: the worker reads it from the R2 object `current-version`,
# which .github/workflows/release.yml writes. Deploy only when this worker's code changes.
