name: Release

# Push a tag `v<version>` matching package.json → installers are built and uploaded to the R2 bucket
# `anonymo` under v<version>/, then the object `current-version` is switched to <version>, which is
# what the download worker (https://anonymo.shanoon.workers.dev) serves. The worker itself is not
# redeployed here; deploy it by hand (`npx wrangler deploy` in download-worker/) when its code changes.
#
# Needs repository (or `release` environment) secrets, from an R2 API token limited to Object Read &
# Write on the `anonymo` bucket only (R2 → Manage R2 API Tokens):
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
#   CLOUDFLARE_ACCOUNT_ID

on:
  push:
    tags: ['v*']
  workflow_dispatch: # run it on a tag ref (Use workflow from → Tags → v…)

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$REF_TYPE" != tag ] || [ "$REF_NAME" != "v$version" ]; then
            echo "::error::Run on tag v$version (package.json), got $REF_TYPE '$REF_NAME'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml

  build-mac:
    needs: version
    uses: ./.github/workflows/build-mac.yml

  publish:
    needs: [version, build, build-mac]
    runs-on: ubuntu-latest
    environment: release
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # R2's S3 API with a bucket-scoped token (aws CLI is preinstalled on ubuntu runners). No
      # per-object size cap, unlike `wrangler r2 object put` (300 MiB); the cli switches to multipart.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
      R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: release
          merge-multiple: true

      - name: Check installers and write checksums
        working-directory: release
        run: |
          exe="Anonymo-Setup-$VERSION.exe"
          dmg="Anonymo-$VERSION-arm64.dmg"
          for f in "$exe" "$dmg"; do
            [ -f "$f" ] || { echo "::error::missing $f"; ls -la; exit 1; }
          done
          sha256sum "$exe" "$dmg" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # In-app updates on Windows (src/main/update.ts). electron-builder writes the installer's path in
      # latest.yml relative to the feed; the worker serves the feed at / but the files under v<version>/.
      # The blockmap lets the next version download only the blocks that changed.
      - name: Prepare update feed
        working-directory: release
        run: |
          for f in latest.yml "Anonymo-Setup-$VERSION.exe.blockmap"; do
            [ -f "$f" ] || { echo "::error::missing $f"; ls -la; exit 1; }
          done
          node -e '
            const fs = require("fs"), v = process.env.VERSION
            const yml = fs.readFileSync("latest.yml", "utf8")
            fs.writeFileSync("latest.yml", yml.replace(/^(\s*-?\s*url: |path: )Anonymo-Setup-/gm, `$1v${v}/Anonymo-Setup-`))
          '
          cat latest.yml
          grep -q "^version: $VERSION$" latest.yml || { echo "::error::latest.yml is not for $VERSION"; exit 1; }
          [ "$(grep -c "v$VERSION/Anonymo-Setup-$VERSION.exe" latest.yml)" -eq 2 ] || { echo "::error::latest.yml paths were not rewritten"; exit 1; }

      # Versioned paths are served as immutable, so never overwrite a release that is already live.
      - name: Refuse to overwrite an existing release
        run: |
          if aws s3api head-object --endpoint-url "$R2_ENDPOINT" --bucket anonymo --key "v$VERSION/SHA256SUMS.txt" > /dev/null 2>&1; then
            echo "::error::v$VERSION is already in R2 — bump the version"
            exit 1
          fi
          # …and fail here, not halfway through the upload, if the credentials are wrong.
          aws s3api list-objects-v2 --endpoint-url "$R2_ENDPOINT" --bucket anonymo --prefix v --max-items 1 > /dev/null

      - name: Upload to R2
        working-directory: release
        run: |
          # Checksums last: the download page shows them, so they mark the release complete.
          for f in "Anonymo-Setup-$VERSION.exe.blockmap" "Anonymo-Setup-$VERSION.exe" "Anonymo-$VERSION-arm64.dmg" latest.yml SHA256SUMS.txt; do
            aws s3 cp "$f" "s3://anonymo/v$VERSION/$f" --endpoint-url "$R2_ENDPOINT" --only-show-errors \
              --content-disposition "attachment; filename=\"$f\""
          done

      # Only now, with every file in place, do /windows, /mac and the update feeds move to the new version.
      - name: Switch current version
        run: |
          printf '%s' "$VERSION" > current-version
          aws s3 cp current-version s3://anonymo/current-version --endpoint-url "$R2_ENDPOINT" --only-show-errors \
            --content-type text/plain --cache-control no-store

      - name: Smoke test
        run: |
          base=https://anonymo.shanoon.workers.dev
          for p in windows mac; do
            loc=$(curl -sI "$base/$p" | tr -d '\r' | awk 'tolower($1)=="location:"{print $2}')
            echo "/$p → $loc"
            case "$loc" in *"/v$VERSION/"*) ;; *) echo "::error::/$p does not point at v$VERSION"; exit 1;; esac
            curl -sfI "$loc" > /dev/null || { echo "::error::$loc is not served"; exit 1; }
          done
          # The app offers updates from these (src/main/update.ts): latest.json on macOS, latest.yml on Windows.
          latest=$(curl -sf "$base/latest.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          echo "/latest.json → $latest"
          [ "$latest" = "$VERSION" ] || { echo "::error::/latest.json says $latest, expected $VERSION"; exit 1; }
          curl -sf "$base/latest.yml" | grep -q "^version: $VERSION$" || { echo "::error::/latest.yml is not for $VERSION"; exit 1; }
          curl -sfI "$base/v$VERSION/Anonymo-Setup-$VERSION.exe.blockmap" > /dev/null || { echo "::error::blockmap is not served"; exit 1; }
